[project]
name = "tmdbx"
version = "0.1.0"
description = "Typed sync/async Python client for the TMDB API v3 and v4, with models generated from the official OpenAPI spec and disk caching"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diskcache>=5.6.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "datamodel-code-generator[ruff]>=0.54.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # makes scripts/ importable for tests

[tool.datamodel-codegen]
input = "data/tmdb_v3_openapi_patched.json"
input-file-type = "openapi"
output = "src/tmdbx/models/v3.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
openapi-scopes = ["paths"]
use-annotated = true
snake-case-field = true
base-class = "tmdbx.models._base.TMDBModel"
reuse-model = true
collapse-root-models = true
formatters = ["ruff-format", "ruff-check"]
field-constraints = true
